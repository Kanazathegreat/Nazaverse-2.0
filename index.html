<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Nazaverse - Aplikasi pendamping AI bertema galaxy dengan pet interaktif.">
<style>[hidden]{display:none!important}html{padding:0}body{margin:0}</style>
<title>Nazaverse</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/style.css">
</head>
<body>

<canvas id="sky"></canvas>
<div class="app" id="app" data-st="chat">
<aside class="rail" id="rail">
  <div class="brand">Nazaverse</div>
  <div class="stations" id="stations"></div>
  <nav id="tops"></nav>
  <button class="lnk" id="addt"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19l6-8"/><path d="M10 11l5-4" stroke-dasharray="1.5 2.5"/><circle class="f" cx="4" cy="19" r="1.6"/><circle class="f" cx="10" cy="11" r="1.6"/><path class="a" d="M18 3v8M14 7h8"/></svg><span data-i="add_topic"></span></button>
  <div class="nt" id="nt" hidden>
    <svg id="npv" viewBox="0 0 100 60" aria-hidden="true"></svg>
    <input id="ntn" maxlength="22" data-ph="topic_name" aria-label="Topic name">
    <input id="nti" maxlength="60" data-ph="topic_ins" aria-label="Topic purpose">
    <button class="lnk" id="mk" style="margin:0"><span data-i="save_topic"></span></button>
  </div>
  <button class="foot" id="foot"></button>
</aside>
<div class="scrim" id="scrim"></div>
<main class="main">
  <header class="top">
    <button id="menu" data-t="menu"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h9M3 18h18"/><path class="f" d="M18 8.4l.9 2.7 2.7.9-2.7.9-.9 2.7-.9-2.7-2.7-.9 2.7-.9z"/></svg></button>
    <h2 id="tn"></h2>
    <div id="ttl"></div>
    <div class="ctl" id="seg">
      <span class="hm"><button data-m="ask" class="on" data-i="ask_first"></button><button data-m="auto" data-i="auto"></button></span>
      <span class="sep" id="hmsep"></span>
      <button id="wp" class="on"></button>
      <button id="vw"></button>
      <span class="sep"></span>
      <span class="hm" style="display:flex"><button data-l="id">id</button><button data-l="en">en</button></span>
      <button id="gear" data-t="settings"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle class="f a2" cx="16" cy="7" r="2"/><circle class="f a2" cx="8" cy="17" r="2"/></svg></button>
    </div>
    <div id="state"><svg class="ico wi" viewBox="0 0 24 24" aria-hidden="true"><circle class="ring" cx="12" cy="12" r="9.5"/><path class="f" d="M12 6.5l1.4 4.1 4.1 1.4-4.1 1.4-1.4 4.1-1.4-4.1-4.1-1.4 4.1-1.4z"/></svg><span id="stt"></span></div>
  </header>
  <section id="chatcol">
    <div class="wiz" id="wiz"></div>
    <section id="feed"><div class="wrap">
      <div id="empty"><h1 id="eh"></h1><p id="ep"></p><div id="chips"></div></div>
      <div id="log"></div>
    </div></section>
    <footer class="comp">
      <div id="menuC" hidden></div>
      <div class="box">
        <button class="tb" id="att"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" stroke-dasharray="2.5 3.2"/><path class="a" d="M12 8v8M8 12h8"/></svg><span data-i="attach"></span></button>
        <button class="tb on" id="webT"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19l9-9"/><path d="M13 5l6 6-3 3-6-6z"/><circle class="f" cx="5" cy="19" r="1.5"/></svg><span data-i="web"></span></button>
        <textarea id="inp" rows="1" data-ph="ph_input" aria-label="Message"></textarea>
        <button class="tb" id="send"><span data-i="send"></span></button>
      </div>
    </footer>
  </section>
  <aside class="stage" id="stage">
    <div class="win" id="win">
      <div class="cap" id="cap" aria-live="polite"></div>
      <div class="pet" id="pet" data-s="sleep" role="button" tabindex="0">
        <!-- SVG injected by JS -->
      </div>
      <div class="sill"><span class="plate" id="plate"></span></div>
    </div>
  </aside>
</main>
</div>

<aside id="sett" aria-label="Settings">
  <div class="sh"><h2 data-i="settings"></h2><button class="lnk" id="sclose" style="margin:0"><span data-i="close"></span></button></div>
  <div id="settBody"></div>
</aside>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
